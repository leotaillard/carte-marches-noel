<title>Marchés de Noël 2026 – La Liberté</title>

<style>

@font-face{font-family:"Forme Grotesque Pro";font-weight:400;font-display:swap;src:url("https://www.laliberte.ch/fonts/forme-grotesque/forme-grotesque-regular-pro.woff2") format("woff2")}
@font-face{font-family:"Forme Grotesque Pro";font-weight:700;font-display:swap;src:url("https://www.laliberte.ch/fonts/forme-grotesque/forme-grotesque-bold-pro.woff2") format("woff2")}
:root{
  --ll-red:#E21B22;        /* rouge La Liberté (surtitres, liens, accents) */
  --ll-red-light:#F4353C;  /* rouge clair (survol, mode sombre) */
  --ll-black:#000;
  --ll-gray-900:#454545;
  --ll-gray-500:#7D7D7D;   /* texte secondaire */
  --ll-gray-300:#DBDBDB;   /* bordures marquées */
  --ll-gray-200:#E8E8E8;   /* filets */
  --ll-gray-100:#F2F2F2;   /* fonds légers */
  --ll-white:#fff;
  --font-sans:"Forme Grotesque Pro",Inter,"Helvetica Neue",Arial,sans-serif;  /* tout le reste : interface, liste, infobulles */
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--ll-white);color:var(--ll-black);font:16px/1.45 var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%;min-height:540px}
#map{position:relative;height:100%;min-height:420px;background:var(--ll-gray-300)}
.geste{position:absolute;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:rgba(0,0,0,.5);color:var(--ll-white);font:700 17px/1.3 var(--font-sans);opacity:0;pointer-events:none;transition:opacity .2s}
.geste.on{opacity:1}
aside{border-left:1px solid var(--ll-gray-200);display:flex;flex-direction:column;min-height:0}
.head{padding:16px 18px 14px;border-bottom:1px solid var(--ll-gray-200)}
#count{margin:0 0 12px;color:var(--ll-gray-500);font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:14px;border:1px solid var(--ll-gray-300);background:var(--ll-white);color:var(--ll-black);border-radius:999px;padding:6px 13px;min-height:36px;cursor:pointer}
.filters button:hover{border-color:var(--ll-black)}
.filters button[aria-pressed=true]{background:var(--ll-black);color:var(--ll-white);border-color:var(--ll-black)}
.filters button:focus-visible,li:focus-visible{outline:2px solid var(--ll-red);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
li{padding:12px 18px;border-bottom:1px solid var(--ll-gray-200);cursor:pointer}
li:hover{background:var(--ll-gray-100)}
li .t{font:700 17px/1.2 var(--font-sans)}
li .m{color:var(--ll-gray-500);font-size:14px;margin-top:2px}
.badge{display:inline-block;font:700 11px/1 var(--font-sans);padding:4px 7px;border-radius:2px;margin-left:6px;vertical-align:2px}
.now{background:var(--ll-red);color:var(--ll-white)}
.soon{background:var(--ll-gray-100);color:var(--ll-gray-900)}
.empty{padding:20px 18px;color:var(--ll-gray-500);cursor:default}
li.more{padding:12px 18px 16px;cursor:default;border-bottom:0}
li.more:hover{background:none}
.more button{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--ll-black);background:var(--ll-white);color:var(--ll-black);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer;width:100%}
.more button:hover{background:var(--ll-black);color:var(--ll-white)}
.more button:focus-visible{outline:2px solid var(--ll-red);outline-offset:2px}
.pin{position:relative;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ll-black);border:3px solid var(--ll-white);box-shadow:0 1px 5px rgba(0,0,0,.45)}
.pin::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ll-white)}
.pin.on{background:var(--ll-red)}
.leaflet-marker-icon:hover .pin,.leaflet-marker-icon:focus .pin{transform:rotate(-45deg) scale(1.15)}
.cluster{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:var(--ll-black);color:var(--ll-white);border:3px solid var(--ll-white);box-shadow:0 1px 5px rgba(0,0,0,.45);font:700 15px/1 var(--font-sans);box-sizing:border-box}
.cluster.on{background:var(--ll-red)}
.leaflet-marker-icon:hover .cluster,.leaflet-marker-icon:focus .cluster{transform:scale(1.1)}
.leaflet-tooltip.etiq{background:transparent;border:0;box-shadow:none;padding:0 0 0 2px;font:700 12px/1.1 var(--font-sans);color:var(--ll-black);text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 4px #fff,0 0 4px #fff}
.leaflet-tooltip.etiq::before{display:none}
.leaflet-container{font-family:var(--font-sans);background:var(--ll-gray-300)}
.ville{position:absolute;display:flex;align-items:center;gap:5px;transform:translate(-3px,-50%);white-space:nowrap;font:400 12px/1 var(--font-sans);color:var(--ll-gray-900);text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 4px #fff}
.ville i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--ll-gray-900)}
.ville.main{font-weight:700;font-size:13px;color:var(--ll-black)}
.ville.main i{width:8px;height:8px;background:var(--ll-black)}
.ville.petite{font-size:11px;color:var(--ll-gray-500)}
.ville.petite i{width:4px;height:4px;background:var(--ll-gray-500)}
.leaflet-popup-content-wrapper{border-radius:2px}
.leaflet-popup-content{font:15px/1.4 var(--font-sans);margin:12px 14px}
.leaflet-popup-content .pl{font:700 17px/1.2 var(--font-sans)}
.leaflet-popup-content .pn{margin-top:2px}
.leaflet-popup-content .d{color:var(--ll-gray-500);font-size:14px;margin-top:4px}
.leaflet-popup-content .badge{margin:8px 0 0}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ll-gray-500);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
@media(max-width:700px){
  .wrap{grid-template-columns:1fr;grid-template-rows:380px auto;height:auto;min-height:0}
  #map{min-height:0}
  aside{border-left:0;border-top:1px solid var(--ll-gray-200)}
  .head{padding:12px 16px 10px}
  ul{max-height:none;overflow:visible}
  li{padding:10px 16px}
  li.more{padding:10px 16px 14px}
}
</style>
</head>

    <div class="head">
      <p id="count"></p>

        <button data-f="all" aria-pressed="true">Tous</button>

        <button data-f="we" aria-pressed="false">Ce week-end</button>
      </div>
      <div class="legend"><span><i style="background:var(--ll-red)"></i>Ouvert aujourd’hui</span><span><i style="background:var(--ll-black)"></i>À venir</span></div>
    </div>
    <ul id="list"></ul>
  </aside>
</div>

const jf = s => { const d = parse(s); return d.getDate() + (d.getDate()===1?'er':'') + ' ' + mois[d.getMonth()]; };
const datesTxt = m => m.dates || (m.a === m.b ? 'Le ' + jf(m.a) : 'Du ' + jf(m.a) + ' au ' + jf(m.b));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== CARTE ===== */
/* Fond épuré, sans tuiles : région en blanc, limites de districts et de cantons, lacs, chefs-lieux.
   Géométries dans FOND (script plus haut), tirées des données ouvertes swisstopo (outils/fond-carte.py). */
/* Écrans tactiles : un doigt fait défiler l'article, deux doigts déplacent et zooment la carte. */
const tactile = matchMedia('(pointer: coarse)').matches;
const map = L.map('map', {scrollWheelZoom:false, dragging:!tactile, zoomSnap:0.5, minZoom:9, maxZoom:16,
  maxBounds:[[46.30,6.45],[47.20,7.65]], maxBoundsViscosity:0.8}).setView([46.72, 7.03], 10);
if (tactile) {
  const geste = document.createElement('div');
  geste.className = 'geste'; geste.setAttribute('aria-hidden', 'true');
  geste.textContent = 'Utilisez deux doigts pour déplacer la carte';
  map.getContainer().appendChild(geste);
  let t;
  map.getContainer().addEventListener('touchmove', e => {
    if (e.touches.length === 1) { geste.classList.add('on'); clearTimeout(t); t = setTimeout(() => geste.classList.remove('on'), 1200); }
    else geste.classList.remove('on');
  }, {passive:true});
}
map.attributionControl.setPrefix(false).addAttribution('© <a href="https://www.swisstopo.admin.ch/" target="_blank" rel="noopener">swisstopo</a>');
const vec = {interactive:false};
L.polygon(FOND.region, {...vec, stroke:false, fillColor:'#fff', fillOpacity:1}).addTo(map);
L.polygon(FOND.bati, {...vec, stroke:false, fillColor:'#E4E4E4', fillOpacity:1}).addTo(map);
const districts = L.polyline(FOND.districts, {...vec, color:'#C4C4C4', weight:1}).addTo(map);
const routes = L.layerGroup([
  L.polyline(FOND.routes.h, {...vec, color:'#B8B8B8', weight:1.6}),
  L.polyline(FOND.routes.a, {...vec, color:'#8C8C8C', weight:2.4})]).addTo(map);
L.polyline(FOND.cantons, {...vec, color:'#7D7D7D', weight:1.5, lineJoin:'round'}).addTo(map);
L.polygon(FOND.lacs, {...vec, stroke:false, fillColor:'#C9D7E0', fillOpacity:1}).addTo(map);
/* Relief swisstopo en ombrage léger, mélangé au fond. */
map.createPane('relief').style.zIndex = 402;
map.getPane('relief').style.mixBlendMode = 'multiply';
L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.leichte-basiskarte_reliefschattierung/default/current/3857/{z}/{x}/{y}.png', {pane:'relief', opacity:0.35}).addTo(map);
/* Rues swisstopo (swissTLM3D, sans noms) passées en gris, dès le zoom 12. */
map.createPane('rues').style.zIndex = 405;
map.getPane('rues').style.filter = 'grayscale(1) contrast(1.15)';
L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swisstlm3d-strassen/default/current/3857/{z}/{x}/{y}.png', {pane:'rues', minZoom:12, opacity:0.75}).addTo(map);
/* Noms de localités. Un nom est masqué quand un marché visible tout près porte déjà ce nom (voir majVilles). */
map.createPane('villes').style.zIndex = 450;
const villes = [];
const ville = (n, la, lo, cls) => { const mk = L.marker([la,lo], {pane:'villes', interactive:false, keyboard:false, nom:n,
  icon: L.divIcon({className:'', iconSize:[0,0], html:'<div class="ville'+(cls?' '+cls:'')+'"><i></i>'+esc(n)+'</div>'})}); villes.push(mk); return mk; };
/* Chefs-lieux des districts, toujours affichés. */
[['Fribourg',46.8060,7.1620,'main'],['Bulle',46.6195,7.0567],['Romont',46.6966,6.9186],['Estavayer',46.8489,6.8466],
 ['Morat',46.9283,7.1175],['Tavel',46.8269,7.2033],['Châtel-St-Denis',46.5266,6.9006],['Payerne',46.8211,6.9378]]
.forEach(([n,la,lo,cls]) => ville(n,la,lo,cls).addTo(map));
/* Autres localités, selon le zoom : les grandes dès 10,5, les autres dès 12. */
const loc1 = L.layerGroup(FOND.villes.filter(v => v[3] === 1).map(([n,la,lo]) => ville(n,la,lo,'petite')));
const loc2 = L.layerGroup(FOND.villes.filter(v => v[3] === 2).map(([n,la,lo]) => ville(n,la,lo,'petite')));
const selonZoom = () => { const z = map.getZoom();
  z >= 13 ? routes.remove() : routes.addTo(map);        // les rues swisstopo prennent le relais
  z >= 14 ? districts.remove() : districts.addTo(map);  // limites simplifiées à 50 m, imprécises de près
  z >= 10.5 ? loc1.addTo(map) : loc1.remove();
  z >= 12 ? loc2.addTo(map) : loc2.remove(); };
map.on('zoomend', selonZoom); selonZoom();
map.on('focus', () => map.scrollWheelZoom.enable());
map.on('blur', () => map.scrollWheelZoom.disable());
const icon = on => L.divIcon({className:'', html:'<div class="pin'+(on?' on':'')+'"></div>', iconSize:[26,26], iconAnchor:[13,31], popupAnchor:[0,-30]});
const popup = m => '<div class="pl">'+esc(m.l)+'</div><div class="pn">'+esc(m.n)+'</div><div class="d">'+esc(datesTxt(m))+(m.h?'<br>'+esc(m.h):'')+'</div>'
  + (m.on ? '<div><span class="badge now">Ouvert aujourd’hui</span></div>' : '');
/* Regroupement des épingles proches en pastilles numérotées (rouges si un marché du groupe est ouvert aujourd'hui).
   Un clic sur une pastille zoome dessus ; au zoom maximal, les épingles superposées s'écartent. */
const layer = L.markerClusterGroup({
  maxClusterRadius: 45, showCoverageOnHover: false, spiderfyOnMaxZoom: true,
  iconCreateFunction: c => {
    const n = c.getChildCount(), on = c.getAllChildMarkers().some(mk => mk.options.on), size = n < 10 ? 36 : 42;
    return L.divIcon({className:'', iconSize:[size,size],
      html:'<div class="cluster'+(on?' on':'')+'" aria-label="'+n+' marchés">'+n+'</div>'});
  }
}).addTo(map);
const list = document.getElementById('list');
const count = document.getElementById('count');
let live = [];

/* Sur mobile, la liste s'empile sous la carte : on n'affiche que les prochains marchés,
   le reste sur demande, pour garder l'iframe courte. */
const LIMITE_MOBILE = 3;
const mobile = matchMedia('(max-width:700px)');
let rows = [], markers = [], expanded = false;

function render(f){
  layer.clearLayers();
  rows = live.filter(m => f === 'now' ? m.on : f === 'we' ? weDays.some(x => openOn(m,x)) : true);
  markers = rows.map(m => L.marker(m.c, {icon: icon(m.on), title: m.l, on: m.on}).bindPopup(popup(m))
    .bindTooltip(esc(m.l), {permanent:true, direction:'right', offset:[12,-17], className:'etiq'}));
  layer.addLayers(markers);
  count.textContent = rows.length + (rows.length > 1 ? ' marchés' : ' marché') + ' · mis à jour le ' + jf(today);
  expanded = false;
  drawList();
  if (markers.length) map.fitBounds(L.featureGroup(markers).getBounds(), {padding:[30,30], maxZoom:12});
  majVilles();
}

/* Noms sur la carte, par priorité : marchés visibles (ordre de la liste), chefs-lieux, autres localités.
   Un nom qui en chevauche un autre déjà placé est masqué. Le nom d'une localité est aussi masqué
   quand un marché visible à moins de 3 km porte un lieu qui commence par ce nom (« Fribourg, Arsen'alt »). */
const norme = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\bst-/g, 'saint-');
function majVilles(){
  const vus = markers.filter(mk => layer.getVisibleParent(mk) === mk);
  const pris = [];
  const place = (el, cache) => {
    el.style.visibility = '';
    const r = el.getBoundingClientRect();
    if (cache || pris.some(q => r.left < q.right && r.right > q.left && r.top < q.bottom && r.bottom > q.top)) el.style.visibility = 'hidden';
    else pris.push(r);
  };
  vus.forEach(mk => { const el = mk.getTooltip() && mk.getTooltip().getElement(); if (el) place(el, false); });
  villes.forEach(v => {
    const el = v.getElement(); if (!el) return;
    const n = norme(v.options.nom), p = v.getLatLng();
    place(el.firstChild, vus.some(mk => norme(mk.options.title).startsWith(n) && mk.getLatLng().distanceTo(p) < 3000));
  });
}
map.on('zoomend moveend', majVilles);
layer.on('animationend spiderfied unspiderfied', majVilles);

function drawList(){
  const short = mobile.matches && rows.length > LIMITE_MOBILE + 1;
  const shown = short && !expanded ? rows.slice(0, LIMITE_MOBILE) : rows;
  const rest = rows.length - LIMITE_MOBILE;
  list.innerHTML = rows.length ? shown.map((m,i) =>
    '<li tabindex="0" data-i="'+i+'"><div class="t">'+esc(m.l)
    + (m.on ? '<span class="badge now">Aujourd’hui</span>' : m.nx <= addDays(today,7) ? '<span class="badge soon">Bientôt</span>' : '')
    + '</div><div>'+esc(m.n)+'</div><div class="m">'+esc(datesTxt(m))+(m.h?' · '+esc(m.h):'')+(m.r?' · '+esc(m.r):'')+'</div></li>').join('')
    + (short ? '<li class="more"><button type="button" aria-expanded="'+expanded+'">'
      + (expanded ? 'Afficher moins' : 'Voir les ' + rest + ' autres marchés') + '</button></li>' : '')
    : '<li class="empty">Aucun marché pour cette sélection.</li>';
  list.querySelectorAll('li[data-i]').forEach(li => {
    const go = () => {
      const mk = markers[+li.dataset.i];
      layer.zoomToShowLayer(mk, () => {   // sort le marché de sa pastille, puis zoome jusqu'aux rues
        if (map.getZoom() < 14) { map.once('moveend', () => mk.openPopup()); map.setView(mk.getLatLng(), 14); }
        else mk.openPopup();
      });
      if (mobile.matches) map.getContainer().scrollIntoView({behavior:'smooth', block:'start'});
    };
    li.addEventListener('click', go);
    li.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });
  const more = list.querySelector('.more button');
  if (more) more.addEventListener('click', () => {
    expanded = !expanded; drawList();
    if (expanded) list.querySelector('li[data-i="'+LIMITE_MOBILE+'"]').focus();
    else list.querySelector('.more button').focus();
  });
}
mobile.addEventListener('change', drawList);

/* Intégration : la page envoie sa hauteur à l'article, qui ajuste l'iframe (voir README).
   Plus de défilement à l'intérieur de l'iframe, même quand la liste est dépliée. */
if (parent !== window) {
  const wrap = document.querySelector('.wrap');
  let last = 0;
  new ResizeObserver(() => {
    const h = Math.ceil(wrap.getBoundingClientRect().height);
    if (Math.abs(h - last) > 1) { last = h; parent.postMessage({type:'ll-carte-noel-hauteur', hauteur:h}, '*'); }
  }).observe(wrap);
}

document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render(b.dataset.f);
}));

count.textContent = 'Chargement des marchés…';
fetch(CSV_URL, {cache:'no-store'}).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(t => {
  const [head, ...rows] = parseCSV(t);
  const H = head.map(h => h.trim().toLowerCase());
  const col = name => H.indexOf(name);
  const g = (r, name) => { const i = col(name); return i < 0 ? '' : (r[i] || '').trim(); };
  live = rows.map(r => ({
    n: g(r,'nom'), l: g(r,'lieu'), r: g(r,'région'), h: g(r,'infos'), dates: g(r,'dates'),
    c: [num(g(r,'latitude')), num(g(r,'longitude'))],
    a: toIso(g(r,'début')), b: toIso(g(r,'fin')) || toIso(g(r,'début')), wd: parseJours(g(r,'jours'))
  }))
  .filter(m => m.n && m.a && m.b && isFinite(m.c[0]) && isFinite(m.c[1]))
  .map(m => ({...m, nx: nextOpen(m)})).filter(m => m.nx)
  .map(m => ({...m, on: openOn(m, today)}))
  .sort((a,b) => a.nx.localeCompare(b.nx) || a.l.localeCompare(b.l));
  render('all');
}).catch(() => {
  count.textContent = 'Impossible de charger la liste des marchés pour le moment.';
});
}
</script>
</body>
</html>
